<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Family Dashboard">
  <!--
    The browser tab icon. Vector, so it stays sharp at 16px on a laptop and at
    any zoom or pixel ratio — which the 16×16 ICO it replaced never could.

    Geometry is generated from GEOMETRY in scripts/generate-app-icons.mjs, at
    the same 0.14 inset as icon-192/256/512. Keep the three copies in step:
    this file, that script, and src/components/BrandMark.tsx.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2622" />
      <stop offset="1" stop-color="#1c1917" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.08" fill="url(#plate)" />
  <g fill="#f6f4f0">
    <rect x="39.373" y="15.872" width="4.378" height="9.677" rx="1.014" />
    <polygon points="32,13.107 13.107,30.618 50.893,30.618" />
    <rect x="17.715" y="29.696" width="28.57" height="21.197" rx="2.765" />
  </g>
  <g fill="#b45309">
    <circle cx="28.452" cy="37.299" r="4.055" />
    <circle cx="35.548" cy="37.299" r="4.055" />
    <polygon points="24.858,38.451 39.142,38.451 32,47.575" />
  </g>
</svg>
